<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Forecast Lookup</title>

    <!-- Link to external stylesheet -->
    <link rel="stylesheet" th:href="@{/style.css}">

    <!-- Dynamic background image based on time of day -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var hour = new Date().getHours();
            var body = document.body;

            if (hour >= 5 && hour < 9) {
                // Morning (5am - 9am)
                body.style.background = "url('https://images.unsplash.com/photo-1494548162494-384bba4ab999?q=80&w=2360&auto=format&fit=crop') no-repeat center center fixed";
            } else if (hour >= 9 && hour < 18) {
                // Afternoon (9am - 6pm)
                body.style.background = "url('https://images.unsplash.com/photo-1541119638723-c51cbe2262aa?w=700&auto=format&fit=crop') no-repeat center center fixed";
            } else if (hour >= 18 && hour < 21) {
                // Evening (6pm - 9pm)
                body.style.background = "url('https://media.istockphoto.com/id/2159825784/photo/sunset-sky.webp') no-repeat center center fixed";
            } else {
                // Night (9pm - 5am)
                body.style.background = "url('https://images.unsplash.com/photo-1509773896068-7fd415d91e2e?w=700&auto=format&fit=crop') no-repeat center center fixed";
            }

            body.style.backgroundSize = "cover";
        });
    </script>
</head>
<body>

<h1>Weather Forecast Lookup</h1>

<!-- Form for latitude and longitude input -->
<form action="/forecast" method="post" th:object="${coords}">

    <!-- Latitude input field -->
    <div>
        <label for="latitude">Latitude (e.g., 34.0522 for Los Angeles)</label><br>
        <input type="text" id="latitude" th:field="*{latitude}" placeholder="Enter Latitude" required>
    </div>
    <br>

    <!-- Longitude input field -->
    <div>
        <label for="longitude">Longitude (e.g., -118.2437 for Los Angeles)</label><br>
        <input type="text" id="longitude" th:field="*{longitude}" placeholder="Enter Longitude" required>
    </div>
    <br>

    <!-- Submit and location autofill buttons -->
    <div>
        <button type="submit">Get Forecast</button>
        <button type="button" onclick="getLocation()">Use My Location</button>
    </div>

</form>

<!-- Geolocation autofill script -->
<script>
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                document.getElementById("latitude").value = position.coords.latitude;
                document.getElementById("longitude").value = position.coords.longitude;
            }, function(error) {
                alert("Unable to retrieve your location. Please enter manually.");
            });
        } else {
            alert("Geolocation is not supported by this browser.");
        }
    }
</script>

</body>
</html>
